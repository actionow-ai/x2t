# 本机开发依赖：Postgres
# 端口用非标准 55432 避让（宿主机 55432 -> 容器 5432），
# 避免与开发机上其他 Postgres 冲突 —— 团队规则 TEA-40。
services:
  db:
    image: postgres:16
    container_name: x2t-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: x2t
      POSTGRES_PASSWORD: x2t
      POSTGRES_DB: x2t
    ports:
      - "55432:5432" # 非标准避让端口
    volumes:
      - x2t_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U x2t -d x2t"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 自建 RSSHub —— 统一抓取网关（X / Reddit / StockTwits 等需登录或反爬的源经此路由）。
  # 端口非标准 51200 避让（宿主 51200 -> 容器 1200），团队规则 TEA-40。
  # 应用侧 sourceConfig.feedPath 经 RSSHUB_BASE_URL 解析到此服务（见 src/lib/connectors/rss.ts）。
  rsshub:
    image: diygod/rsshub:latest
    container_name: x2t-rsshub
    restart: unless-stopped
    ports:
      - "51200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory # 内存缓存，免 Redis
      CACHE_EXPIRE: "600" # 缓存 10 分钟，控制对上游的抓取频率
      # X 抓取需登录 cookie 的 auth_token（逗号分隔可多账号），从宿主环境/.env 注入。
      # 不填则 /twitter/* 路由会失败（其余路由如 /reddit 不受影响）。
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:1200/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ===== 应用（默认 profile=full 才启用，本机开发通常只起 db + rsshub）=====
  # Next 应用（精简 standalone 运行时）。宿主 53000 -> 容器 3000，避让标准 3000。
  # 合并服务：一个容器内同时跑 web + worker（见 Dockerfile 的 CMD）。
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: x2t-app
    restart: unless-stopped
    profiles: ["full"]
    # .env 提供 LLM/行情/SMTP/VAPID 等密钥；不存在也能起（降级为 mock）。
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000 # 覆盖镜像默认 8080（Zeabur 用 8080）
      DATABASE_URL: postgresql://x2t:x2t@db:5432/x2t?schema=public
      RSSHUB_BASE_URL: http://rsshub:1200
    ports:
      - "53000:3000"
    depends_on:
      db:
        condition: service_healthy
      rsshub:
        condition: service_started

volumes:
  x2t_pgdata:
